[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oaaa-rl"
version = "0.0.1"
description = "Reinforcement-learning agent for the Odin Axis & Allies engine (see ../plan.md)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "tqdm",
]

[project.optional-dependencies]
gnn = [
  "torch_geometric>=2.5",
]
train = [
  "ray[default]>=2.9",
  "hydra-core>=1.3",
  "wandb>=0.16",
]
dev = [
  "pytest>=8.0",
  "pytest-xdist",
]

[tool.hatch.build.targets.wheel]
packages = [
  "triplea_odin",
  "model",
  "mcts",
  "train",
  "envs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
